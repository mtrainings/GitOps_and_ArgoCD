apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bf7
  namespace: argocd
spec:
  project: breakfix
  source:
    repoURL: http://gitea:3000/finance/ledger.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: bf-7
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
