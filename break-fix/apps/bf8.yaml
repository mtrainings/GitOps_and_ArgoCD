apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bf8
  namespace: argocd
spec:
  project: breakfix
  source:
    repoURL: http://gitea:3000/student/breakfix.git
    targetRevision: main
    path: bf8
  destination:
    server: https://kubernetes.default.svc
    namespace: bf-8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
