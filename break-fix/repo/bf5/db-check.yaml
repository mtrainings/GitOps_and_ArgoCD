apiVersion: batch/v1
kind: Job
metadata:
  name: invoices-db-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.37
          command: ["sh", "-c", "echo checking invoices database; test -n \"$DB_HOST\" && echo ok"]
          env:
            - name: DB_HOST
              value: ""
