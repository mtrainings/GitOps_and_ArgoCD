apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: routing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: routing-config
                  key: message
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
