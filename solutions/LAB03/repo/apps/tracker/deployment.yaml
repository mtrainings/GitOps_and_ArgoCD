apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/part-of: parcelpal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker
    spec:
      containers:
        - name: tracker
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: "ParcelPal parcel tracker - now with GitOps"
            - name: PODINFO_UI_COLOR
              value: "#2e6db4"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
